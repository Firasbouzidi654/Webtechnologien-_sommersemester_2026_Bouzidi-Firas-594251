services:
  - type: web
    name: kindercare-backend-java
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/children
spring.application.name=kindercare-connect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.flyway.ignore-migration-patterns=*:missing


server.error.include-message=always

server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kindercare}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kindercare}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kindercare}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

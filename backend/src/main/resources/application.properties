spring.application.name=kindercare-connect

# Database structure is maintained by Flyway so a deployed PostgreSQL schema cannot
# silently drift from the entities used by the application.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Earlier releases recorded V1-V5 and later removed those files. Keep their history
# valid, then apply the current forward-only repair migration.
spring.flyway.ignore-migration-patterns=*:missing

# Expose the reason text from ResponseStatusException (e.g. "Invalid email or password.")
# in the JSON error body so the frontend can show it directly.
server.error.include-message=always

# Render supplies these values as environment variables.
server.port=${PORT:10000}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ============================================
# KinderCareConnect Application Properties
# ============================================

# Application Configuration
spring.application.name=KinderCareConnect
server.port=${PORT:10000}
server.servlet.context-path=/

# ============================================
# Database Configuration
# ============================================
# Spring extrait automatiquement le driver, l'utilisateur et le mot de passe de l'URL.
# IMPORTANT : Sur Render, ta variable DATABASE_URL doit commencer par jdbc:postgresql://
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}

# Configuration Flyway (nécessaire car présente dans ton projet)
spring.flyway.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

# ============================================
# JPA/Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=none
# Important : On dit à Hibernate d'attendre que Flyway ait fini
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.show-sql=false

# ============================================
# Connection Pool Configuration (Hikari)
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ============================================
# Logging Configuration
# ============================================
logging.level.root=WARN
logging.level.de.htw_berlin=INFO
logging.level.org.springframework.web=WARN

# ============================================
# Encoding & Compression
# ============================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.compression.enabled=true
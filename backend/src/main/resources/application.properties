# ============================================
# KinderCareConnect Application Properties
# ============================================

# Application Configuration
spring.application.name=KinderCareConnect
server.port=${PORT:9090}
server.servlet.context-path=/

# ============================================
# Database Configuration
# ============================================
# Single DATABASE_URL environment variable for Render
# Format: jdbc:postgresql://username:password@host:port/database
# Default: H2 in-memory for local development

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable username/password for Render (included in DATABASE_URL)
spring.datasource.username=
spring.datasource.password=

# ============================================
# JPA/Hibernate Configuration
# ============================================
# For PostgreSQL, use PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# Connection Pool Configuration
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# Logging Configuration
# ============================================
logging.level.root=WARN
logging.level.de.htw_berlin=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ============================================
# Server Configuration
# ============================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.compression.enabled=true
server.compression.min-response-size=1024


# Local development: Docker Compose starts PostgreSQL on localhost:5432.
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kindercare}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kindercare}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kindercare}
spring.datasource.driver-class-name=org.postgresql.Driver

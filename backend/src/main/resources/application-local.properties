# Local development: Docker Compose starts PostgreSQL on localhost:5433 (host port 5432 is
# commonly taken by a native PostgreSQL service on Windows, which silently steals the connection).
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/kindercare}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kindercare}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kindercare}
spring.datasource.driver-class-name=org.postgresql.Driver

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.0.2'
}

group = 'de.htw-berlin'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL Database Driver
    implementation 'org.postgresql:postgresql:42.7.2'

    // Flyway database migrations
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // H2 — test scope only; not included in the production JAR
    testImplementation 'com.h2database:h2'

    // Connection Pool
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // BCrypt password hashing (used by AuthService)
    implementation 'org.springframework.security:spring-security-crypto'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

node {
    download = true
    version = '20.19.0'
    workDir = file("${rootDir}/frontend/.gradle-node")
    nodeProjectDir = file("${rootDir}/frontend")
}

tasks.register('buildFrontend', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn npmInstall
    args = ['run', 'build']
}

processResources {
    dependsOn buildFrontend
    from("${rootDir}/frontend/dist") {
        into "static"
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

bootRun {
    // Inject every KEY=VALUE from .env as a real environment variable for the Java process.
    // Spring Boot then resolves ${DATABASE_URL}, ${SPRING_DATASOURCE_USERNAME}, etc. from these.
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) return
            def eqIdx  = trimmed.indexOf('=')
            def key    = trimmed.substring(0, eqIdx).trim()
            def value  = trimmed.substring(eqIdx + 1).trim()
            environment(key, value)
        }
    }
    // Always activate the postgresql profile for local bootRun
    // (command-line args override env vars, so this wins even if .env sets SPRING_PROFILES_ACTIVE)
    args = ['--spring.profiles.active=postgresql']
}

tasks.named('test') {
    useJUnitPlatform()
    // Isolate tests from any system-level DATABASE_URL / SPRING_PROFILES_ACTIVE env vars
    systemProperty 'spring.profiles.active', 'test'
}